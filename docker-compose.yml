services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime-gateway
    container_name: traumateam-gateway
    ports:
      - "8080:8080"
      - "50051:50051"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    networks:
      - traumateam-net

  ui:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime-ui
    container_name: traumateam-ui
    ports:
      - "5173:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 3s
    depends_on:
      gateway:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - traumateam-net

networks:
  traumateam-net:
    driver: bridge
