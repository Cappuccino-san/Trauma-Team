version: '3.8'

services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime-gateway
    container_name: traumateam-gateway
    ports:
      - "8080:8080"
      - "50051:50051"
    restart: unless-stopped
    networks:
      - traumateam-net

  ui:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime-ui
    container_name: traumateam-ui
    ports:
      - "5173:80"
    depends_on:
      gateway:
        condition: service_started
    restart: unless-stopped
    networks:
      - traumateam-net

networks:
  traumateam-net:
    driver: bridge
