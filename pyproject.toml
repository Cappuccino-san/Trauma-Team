[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "traumateam"
version = "0.1.0"
description = "Deterministic HEMS mission-feasibility and dispatch decision engine under FAA Part 135 Subpart L"
readme = "README.md"
authors = [{ name = "Senior HEMS Operations & Software Architecture" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pydantic>=2.0.0",
]

[project.scripts]
traumateam = "traumateam.cli:main"
traumateam-demo = "demo_dispatch:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "hypothesis>=6.80.0",
]

[tool.setuptools]
py-modules = ["demo_dispatch"]

[tool.setuptools.packages.find]
where = ["."]
include = ["traumateam*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

